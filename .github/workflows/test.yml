name: Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run GUT Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
      
      - name: Verify Godot Installation
        run: godot --version
      
      - name: Import Assets
        run: godot --headless --editor --quit || true
        
      - name: Run GUT
        run: godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests -gexit
